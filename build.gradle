plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.10'
}

version = '1.0.0'

nextflowPlugin {
    nextflowVersion = '24.04.1'

    provider = 'peterkneale'
    className = 'nci.plugin.NfGadiPlugin'
    extensionPoints = [
        'nci.plugin.NfGadiFactory'
    ]
}

// Command line tool: a self-contained jar that reports on existing job logs
// without Nextflow. Bundles only the classes and libraries it needs.
configurations {
    cli
}

dependencies {
    cli 'org.apache.groovy:groovy:4.0.21'
    cli 'org.apache.groovy:groovy-json:4.0.21'
    cli 'org.slf4j:slf4j-api:2.0.7'
    cli 'org.slf4j:slf4j-nop:2.0.7'   // the tool prints its own summary instead of log messages
}

tasks.register('cliJar', Jar) {
    group = 'build'
    description = 'Builds the gadi-usage-report command line tool as a runnable jar'
    archiveBaseName = 'gadi-usage-report'
    manifest {
        attributes 'Main-Class': 'nci.plugin.cli.GadiUsageReportCli'
    }
    from(sourceSets.main.output) {
        // Leave out the Nextflow plugin classes; the tool does not use them
        exclude 'nci/plugin/NfGadi*', 'nci/plugin/GadiReportPublisher*', 'META-INF/extensions.idx', 'META-INF/MANIFEST.MF'
    }
    from {
        configurations.cli.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class', 'META-INF/versions/*/module-info.class'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Checks the command line tool as users run it: java -jar on the built jar,
// against the scenario logs, comparing its reports with the golden copies.
// Also checks that no Nextflow classes were bundled, since the tool must run
// without Nextflow. The unit tests call the tool in-process, so they would
// not catch either.
def cliCheckDir = layout.buildDirectory.dir('cli-check')
def cliGolden = file('src/test/resources/nci/plugin/cli/golden')
def cliScenarios = file('src/test/resources/nci/plugin/scenarios')

tasks.register('checkCliJar', Exec) {
    group = 'verification'
    description = 'Runs the built gadi-usage-report jar against the scenario logs and compares its reports with the golden copies'
    dependsOn 'cliJar'
    def jar = tasks.named('cliJar', Jar).flatMap { it.archiveFile }
    inputs.file(jar)
    inputs.dir(cliScenarios)
    inputs.dir(cliGolden)
    outputs.dir(cliCheckDir)

    workingDir = cliCheckDir
    commandLine 'java', '-jar', jar.get().asFile.absolutePath, cliScenarios.absolutePath

    doFirst {
        def dir = cliCheckDir.get().asFile
        delete dir
        dir.mkdirs()
        new java.util.zip.ZipFile(jar.get().asFile).withCloseable { zip ->
            def bundled = zip.entries().findAll { it.name.startsWith('nextflow/') }*.name
            if (bundled) {
                throw new GradleException("The command line tool must not bundle Nextflow, but the jar holds ${bundled.size()} nextflow/ entries, e.g. ${bundled[0]}")
            }
        }
    }
    doLast {
        ['UsageReport.csv', 'UsageReport.json'].each { name ->
            def written = cliCheckDir.get().file(name).asFile
            if (written.text != new File(cliGolden, name).text) {
                throw new GradleException("${name} written by the jar differs from the golden copy ${new File(cliGolden, name)}: diff ${written} ${new File(cliGolden, name)}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'checkCliJar'
}
